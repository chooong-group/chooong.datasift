site_name: DataSift
site_description: Streaming XLSX, XLSM and CSV extraction, validation and filtering
site_url: https://chooong-group.github.io/chooong.datasift/
repo_url: https://github.com/chooong-group/chooong.datasift
edit_uri: edit/main/docs/
site_dir: site
strict: true
theme:
  name: material
  language: en
  logo: assets/brand/logo-bright.jpeg
  favicon: assets/brand/favicon.png
  font:
    text: Inter
    code: Roboto Mono
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme)"
      primary: custom
      accent: custom
      toggle:
        icon: material/theme-light-dark
        name: Switch to light appearance
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark appearance
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system appearance
plugins:
  - search
extra_css:
  - stylesheets/chooong.css
markdown_extensions:
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - toc:
      permalink: true
validation:
  nav:
    omitted_files: warn
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
nav:
  - Overview: index.md
  - Installation: installation.md
  - Quickstart: quickstart.md
  - Concepts:
      - Filters: concepts/filters.md
      - Table discovery: concepts/table-discovery.md
      - Column mapping: concepts/column-mapping.md
      - Data types: concepts/data-types.md
      - Streaming: concepts/streaming.md
  - Guides:
      - Excel: guides/excel.md
      - CSV: guides/csv.md
      - Complex layouts: guides/complex-layouts.md
      - Validation: guides/validation.md
      - Exporting: guides/exporting.md
  - API:
      - Python: api/python.md
      - Filter models: api/filters.md
      - JSON Schema: api/json-schema.md
      - CLI: api/cli.md
  - Reference:
      - Limits: reference/limits.md
      - Errors: reference/errors.md
      - File safety: reference/file-safety.md
  - Development:
      - Architecture: development/architecture.md
      - Contributing: development/contributing.md
      - Benchmarks: development/benchmarks.md
