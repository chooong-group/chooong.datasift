[build-system]
requires = ["maturin==1.16.0"]
build-backend = "maturin"

[project]
name = "chooong.datasift"
version = "0.1.0"
description = "Native streaming Excel/CSV discovery, validation, filtering and NDJSON/Parquet export"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt", "licenses/rust-std.html"]
authors = [{name = "Marcus Steinbach"}]
maintainers = [{name = "Chooong"}]
dependencies = ["pydantic>=2.12,<3"]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",

    "Environment :: Console",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Rust",

    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: Filters",
    "Topic :: Utilities",

    "Typing :: Typed",
]
keywords = [
    "excel",
    "xlsx",
    "xlsm",
    "csv",
    "rust",
    "streaming",
    "table-discovery",
    "data-extraction",
    "data-validation",
    "data-filtering",
    "data-processing",
    "etl",
    "parquet",
    "ndjson",
]

[project.urls]
Homepage = "https://github.com/chooong-group/chooong.datasift"
Documentation = "https://datasift.chooong.com"
Repository = "https://github.com/chooong-group/chooong.datasift"
Issues = "https://github.com/chooong-group/chooong.datasift/issues"
Changelog = "https://github.com/chooong-group/chooong.datasift/blob/main/CHANGELOG.md"

[project.scripts]
chooong-datasift = "chooong.datasift.__main__:main"

[tool.maturin]
manifest-path = "datasift-core/Cargo.toml"
module-name = "chooong.datasift.rust"
python-source = "src"
features = ["pyo3/extension-module"]
include = [
    {path = "tests/**/*.py", format = "sdist"},
    {path = "tests/benchmarks/README.md", format = "sdist"},
    {path = ".github/RELEASING.md", format = "sdist"},
    {path = "docs/**/*", format = "sdist"},
    {path = ".github/workflows/*.yml", format = "sdist"},
    {path = ".github/actions/**/*.yml", format = "sdist"},
    {path = "mkdocs.yml", format = "sdist"},
    {path = "SECURITY.md", format = "sdist"},
    {path = "rust-toolchain.toml", format = "sdist"},
    {path = "CONTRIBUTING.md", format = "sdist"},
    {path = "CHANGELOG.md", format = "sdist"},
    {path = "uv.lock", format = "sdist"},
]

exclude = [".data/**", "*.xlsx", "*.xlsm", "*.xls", "*.ndjson", "AGENTS.md", "docs/*verification.md"]

[dependency-groups]
dev = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7,<10",
    "mypy>=1.10,<3",
    "pre-commit>=4,<5",
    "pytest>=8.2,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.16.3",
    "twine>=5.1,<7",
]

[tool.ruff]
required-version = ">=0.16.3"
target-version = "py312"
extend-exclude = [".cache"]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "C4",    # flake8-comprehensions
    "C901",  # mccabe complexity
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "G",     # flake8-logging-format
    "I",     # isort
    "LOG",   # flake8-logging
    "PERF",  # Perflint
    "PLR",   # Pylint Refactor
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "S105",  # hardcoded-password-string
    "S106",  # hardcoded-password-func-arg
    "S107",  # hardcoded-password-default
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
    "UP",    # pyupgrade (for deprecated Python syntax/types)
]
ignore = [
    "ANN401", # Dynamic Any-Annotations allowed
]
extend-select = ["TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN",
    "DTZ",
    "PLR2004",
    "S101",
    "SLF001",
    "T201",
]
"**/runtime/cli.py" = ["T201"]
"__init__.py" = [
    "F401",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
explicit_package_bases = true

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = '-ra --strict-markers --strict-config -m "not benchmark"'
markers = ["benchmark: isolated performance workloads (opt-in)"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["chooong.datasift"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]
