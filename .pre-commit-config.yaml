repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy src tests/benchmarks
        language: system
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
      - id: rust-format
        name: cargo fmt check
        entry: cargo fmt --manifest-path datasift-core/Cargo.toml -- --check
        language: system
        pass_filenames: false
        types: [rust]
      - id: documentation
        name: Documentation build
        entry: uv run --frozen mkdocs build --strict
        language: system
        pass_filenames: false
        files: '(\.md$|mkdocs\.yml$|^docs/)'
