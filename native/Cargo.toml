[package]
name = "chooong-datasift-native"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
description = "Streaming XLSX JSON filter with native Rust evaluation and PyO3 bindings"
repository = "https://github.com/chooong-group/chooong.datasift"
homepage = "https://github.com/chooong-group/chooong.datasift"
documentation = "https://github.com/chooong-group/chooong.datasift/tree/main/docs"

[lib]
name = "rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.1", features = ["abi3-py313"] }
quick-xml = "0.38.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.12"
