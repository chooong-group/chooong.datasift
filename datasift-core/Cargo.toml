[package]
name = "datasift-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
description = "Native streaming Excel/CSV validation and NDJSON/Parquet export with PyO3 bindings"
readme = "README.md"
repository = "https://github.com/chooong-group/chooong.datasift"
homepage = "https://github.com/chooong-group/chooong.datasift"
documentation = "https://github.com/chooong-group/chooong.datasift/tree/main/docs"

[lib]
name = "rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
quick-xml = "0.42.0"
zip = { version = "9.1", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "arbitrary_precision"] }
regex = "1.12"
# Native format adapters and exact values; no Python processing dependencies.
csv = "1.4"
encoding_rs = "0.8"
rust_decimal = { version = "1.39", default-features = false, features = ["std", "serde-with-str"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
unicode-normalization = "0.1"
iso_currency = "0.7"
glob = "0.3"
# Bind recovery journals to the exact staged bytes; never infer rename success.
sha2 = "0.11"
# Directory capabilities and private snapshots protect recovery from path substitution.
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
cap-tempfile = "4.0.3"
parquet = { version = "60", default-features = false, features = ["arrow", "snap"] }
arrow-array = "60"
arrow-schema = "60"
arrow-buffer = "60"

[profile.release]
# Rust 1.95's Mach-O debuginfo stripping can misalign LINKEDIT on macOS 27.
# Preserve the linker output; the pinned toolchain must produce loadable wheels.
strip = "none"
