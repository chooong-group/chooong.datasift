name: Source checks
on:
  workflow_call:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/tooling
      - run: uv lock --check
      # Fail fast on editable source; artifact jobs validate exact installed distributions.
      - run: uv sync --frozen
      - run: uv run --frozen --no-sync pytest tests/ -m "not benchmark" --cov --cov-report=term-missing
      - run: uv run --frozen --no-sync ruff check src tests tooling scripts release
      - run: uv run --frozen --no-sync ruff format --check src tests tooling scripts release
      - run: uv run --frozen --no-sync mypy src scripts release
      - run: uv run --frozen --no-sync mypy --strict tests/benchmarks/*.py
      - run: uv run --frozen --no-sync pytest tooling/tests/
      - run: uv run --frozen --no-sync python scripts/artifacts.py plan
      - run: cargo fmt --manifest-path datasift-core/Cargo.toml -- --check
      - run: cargo clippy --manifest-path datasift-core/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path datasift-core/Cargo.toml --locked
      - run: uv run --frozen --no-sync python scripts/docs.py
      - run: uv run --frozen --no-sync mkdocs build --strict
      - run: git diff --check
