name: Release dry run
# No release/tag trigger: preparation must not publish anything automatically.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version already committed in pyproject.toml and Cargo.toml
        required: true
        type: string
      publish:
        description: Reserved for a separately reviewed activation; publishing is hard-disabled
        required: false
        type: boolean
        default: false
      approved-commit:
        description: Exact reviewed release commit SHA (required for publishing)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    if: github.event.repository.private == false
    uses: ./.github/workflows/checks.yml
  release-identity:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate the explicitly approved tag and commit for publishing
        if: inputs.publish
        env:
          VERSION: ${{ inputs.version }}
          APPROVED_COMMIT: ${{ inputs.approved-commit }}
        shell: bash
        run: |
          test "$GITHUB_REF" = "refs/tags/v$VERSION"
          test "$GITHUB_SHA" = "$APPROVED_COMMIT"
          test "$(git rev-parse "$GITHUB_REF^{commit}")" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
  distributions:
    needs: [checks, release-identity]
    if: github.event.repository.private == false
    uses: ./.github/workflows/artifacts.yml
    with:
      version: ${{ inputs.version }}
  publish:
    needs: distributions
    # Removal of the literal false requires a future reviewed activation PR,
    # protected environment, Pending Trusted Publisher and explicit owner approval.
    if: ${{ false && github.event.repository.private == false && inputs.publish && vars.PYPI_PUBLISH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.distributions.outputs.artifact-id }}
          path: verified
      - name: Recheck gate-authenticated bytes without building or installing project code
        env:
          EXPECTED_SHA256: ${{ needs.distributions.outputs.checksums-sha256 }}
        run: python scripts/verify_publish.py verified "$EXPECTED_SHA256"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: verified/dist/
          skip-existing: false
      - name: Verify the published filenames and bytes on PyPI
        env:
          EXPECTED_SHA256: ${{ needs.distributions.outputs.checksums-sha256 }}
          VERSION: ${{ inputs.version }}
        run: python scripts/verify_publish.py verified "$EXPECTED_SHA256" --pypi-version "$VERSION"
  github-release:
    needs: publish
    if: ${{ needs.publish.result == 'success' && github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish GitHub release only after verified PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          python -c 'import os,pathlib; text=pathlib.Path("CHANGELOG.md").read_text(); version=os.environ["VERSION"]; notes=text.split("## "+version+"\n",1)[1].split("\n## ",1)[0]; pathlib.Path("release-notes.md").write_text(notes)'
          gh release create "v$VERSION" --verify-tag --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release-notes.md
