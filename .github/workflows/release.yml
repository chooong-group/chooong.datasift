name: Release to PyPI
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag matches Python and Rust versions
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          cargo = tomllib.loads(Path("datasift-core/Cargo.toml").read_text())["package"]["version"]
          assert os.environ["GITHUB_REF_NAME"] == f"v{version}", "Tag differs from package version"
          assert cargo == version, "Python and Rust versions differ"
          assert f"## {version}\n" in Path("CHANGELOG.md").read_text(), "Missing release notes"
          PY
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml
  publish:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: Create GitHub Release after PyPI publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          notes = Path("CHANGELOG.md").read_text().split(f"## {version}\n", 1)[1].split("\n## ", 1)[0]
          Path(os.environ["RUNNER_TEMP"], "release-notes.md").write_text(notes)
          PY
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/release-notes.md"
