[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "rust-xlsx-filter"
version = "0.1.0"
requires-python = ">=3.10"
description = "Read huge XLSX files and apply JSON filters natively in Rust"
readme = "README.md"
license = "MIT"
authors = [{name = "Chooong"}]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
rust-xlsx-filter = "rust_xlsx_filter.__main__:main"

[tool.maturin]
module-name = "rust_xlsx_filter._rust"
python-source = "python"
features = ["pyo3/extension-module"]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chooong"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/scripts",
    "/README.md",
    "/pyproject.toml",
    "/.env.example",
    "/alembic.ini",
]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "mypy>=1.10.0",
    "pre-commit>=4.0,<5",
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.16.3",
    "twine>=5.1.0",
]

[tool.ruff]
required-version = ">=0.16.3"
target-version = "py313"
extend-exclude = [".cache"]
line-length = 100
indent-width = 4

[tool.ruff.lint]
select = [
    "ANN",   # flake8-annotations
    "ASYNC", # flake8-async
    "C4",    # flake8-comprehensions
    "C901",  # mccabe complexity
    "DTZ",   # flake8-datetimez
    "E",     # pycodestyle errors
    "F",     # Pyflakes
    "G",     # flake8-logging-format
    "I",     # isort
    "LOG",   # flake8-logging
    "PERF",  # Perflint
    "PLR",   # Pylint Refactor
    "PT",    # flake8-pytest-style
    "PTH",   # flake8-use-pathlib
    "RET",   # flake8-return
    "S105",  # hardcoded-password-string
    "S106",  # hardcoded-password-func-arg
    "S107",  # hardcoded-password-default
    "SIM",   # flake8-simplify
    "T20",   # flake8-print
    "UP",    # pyupgrade (für deprecated Python Syntax/Types)
]
ignore = [
    "ANN401", # Dynamische Any-Annotations erlauben
]


[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 7
max-branches = 12
max-returns = 6
max-statements = 50

[tool.ruff.lint.per-file-ignores]
"scripts/**/*.py" = [
    "ANN",
    "C901",
    "E501",
    "PERF401",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "SLF001",
    "T201",
    "DTZ",
]
"tests/**/*.py" = [
    "ANN",
    "DTZ",
    "PLR2004",
    "S101",
    "SLF001",
    "T201",
]
"**/runtime/cli.py" = ["T201"]
"__init__.py" = [
    "F401",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
docstring-code-format = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = "src"
explicit_package_bases = true
exclude = "^(tests|scripts|src/chooong/orchestrator/migrations)/"

[[tool.mypy.overrides]]
module = ["tests.*"]
check_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["pika.*", "croniter.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.coverage.run]
branch = true
source = ["src/chooong"]
relative_files = true
# Adapters with a live infrastructure boundary (PostgreSQL, RabbitMQ, the
# long-running loop and the composition root) are exercised by
# tests/test_*_integration.py and scripts/real_life_test.py, not by the offline
# unit suite.
omit = [
    "*/orchestrator/adapters/persistence/repository.py",
    "*/orchestrator/adapters/rabbitmq/publisher.py",
    "*/orchestrator/runtime/composition.py",
    "*/orchestrator/runtime/wiring.py",
    "*/orchestrator/runtime/scheduler.py",
    "*/orchestrator/public/control_plane.py",
]

[tool.coverage.report]
fail_under = 80
precision = 2
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config -m 'not integration'"
testpaths = ["tests"]
markers = [
    "integration: requires a real PostgreSQL and/or RabbitMQ; excluded by default",
    "real: hits the real local PostgreSQL + RabbitMQ broker (manual, protected)",
]