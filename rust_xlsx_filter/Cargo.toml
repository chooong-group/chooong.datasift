[package]
name = "rust-xlsx-filter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Streaming XLSX JSON filter with native Rust evaluation and PyO3 bindings"

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27.1", features = ["extension-module"] }
quick-xml = "0.38.4"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.12"
